[mcp_servers."freecad-bridge"]
command = "/bin/sh"
args = [
  "-c",
  'project_dir="$(git rev-parse --show-toplevel)"; exec "$project_dir/.venv-mcp/bin/python" "$project_dir/bridge/mcp_server.py"',
]
env_vars = ["XDG_RUNTIME_DIR", "CAE_BRIDGE_SOCKET"]

[mcp_servers."evidence-library"]
