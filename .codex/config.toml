  'project_dir="$(git rev-parse --show-toplevel)"; exec "$project_dir/.venv-mcp/bin/python" "$project_dir/evidence/mcp_server.py"',
]

[mcp_servers."gmsh-bridge"]
command = "/bin/sh"
args = [
  "-c",
  'project_dir="$(git rev-parse --show-toplevel)"; cd "$project_dir"; exec "$project_dir/.venv-mcp/bin/python" -m integrations.gmsh.mcp_server',
]
env_vars = ["XDG_RUNTIME_DIR", "CAE_GMSH_BRIDGE_SOCKET"]

