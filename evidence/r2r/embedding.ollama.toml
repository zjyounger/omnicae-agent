# Merge this fragment into the R2R configuration used by the optional local
# retrieval deployment. The model and dimension match R2R v3.6.5's official
# full_ollama.toml; the smaller batch is conservative for a workstation.

[embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
batch_size = 32
concurrent_request_limit = 2

[completion_embedding]
provider = "ollama"
base_model = "mxbai-embed-large"
base_dimension = 1_024
batch_size = 32
concurrent_request_limit = 2
