<H3><A NAME="SECTION00082600000000000000"></A><A NAME="Flip_shell_elements"></A>
<BR>
Flip shell elements
</H3>
This function inverts the front and back side of shell elements. Since it is slow the user may work with &rdquo;<A HREF="node20.html#Toggle_Culling_Back_Front">Toggle Culling Back/Front</A>&rdquo; which has often the desired effect without waiting time.
