<H2><A NAME="SECTION00010131000000000000000"></A><A NAME="stop"></A>
<BR>
stop
</H2>
<PRE>
   'stop'
</PRE>
Stops reading of the actual command file and gives the user the opportunity to work interactively until he resumes reading with &ldquo;<A HREF="node80.html#cont">cont</A>&rdquo;. It is possible to update the command file after the stop command.
