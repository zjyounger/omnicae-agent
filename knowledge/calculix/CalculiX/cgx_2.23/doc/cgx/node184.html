<H2><A NAME="SECTION00010118000000000000000"></A><A NAME="seqc"></A>
<BR>
seqc
</H2>
<PRE>
   'seqc' &lt;set&gt;
</PRE>
Converts an &ldquo;<A HREF="node116.html#lcmb">lcmb</A> into a spline. The lcmb will be deleted (not the referenced lines) and keeps the sum of divisions but sets the bias to 1.
