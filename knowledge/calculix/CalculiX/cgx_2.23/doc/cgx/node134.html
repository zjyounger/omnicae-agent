</H2>
<PRE>
   'mm' &lt;value&gt; ['f'|'i'|'e'] ['l'|'u']
</PRE>
This keyword combines the functionality of the commands <A HREF="node123.html#max">max</A> and <A HREF="node130.html#min">min</A> in one command. The minimum value is set to -max.
